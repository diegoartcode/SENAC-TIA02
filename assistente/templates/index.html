<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente Loja Tech</title>
    <link rel="icon" href="image/robot.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css"> 
    <style>   /* comentario css */
   body {
       background: #f1eee4;
       font-family: Arial, Helvetica, sans-serif;
       display: flex;
       justify-content: center;
   }

   #chat {
       width: 360px;
       margin-top: 30px;
       background: #fff;
       border-radius: 10px;
       overflow: hidden;
   }

   header {
       background: #1b2430;
       color: #fff;
       padding: 14px;
   }

   #mensagens {
       height: 380px;
       overflow-y: auto;
       padding: 12px;
   }

   .bot,
   .cliente {
       padding: 8px 12px;
       border-radius: 12px;
       margin: 6px 0;
       max-width: 80%;
   }

   .bot {
       background: #e9e4d6;
   }

   .cliente {
       background: #1f8a70;
       color: #fff;
       margin-left: auto;
   }

   form {
       display: flex;
       border-top: 1px solid #ddd;
   }

   input {
       flex: 1;
       border: 0;
       padding: 12px;
       font-size: 15px;
   }

   button {
       border: 0;
       background: #1f8a70;
       color: #fff;
       padding: 0 16px;
   }</style>
</head>
<!-- comentario html -->
   
<body>
    <div id="chat">
        <header>
            <h1>Assistente virtual - Loja Tech</h1>
        </header>
        <div id="mensagens">
            <div class="bot">
                Olá! Posso ajudar com pedidos, trocas e sugestões
            </div>
        </div>
        <form id="formulario">
            <input type="text" id="texto" autocomplete="off" placeholder="Digite sua mensagem">
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="js/script.js"></script>
    <script>
        // comentario
const caixa = document.getElementById('mensagens');
console.log(caixa);

function mostrar(texto, classe){
    const div = document.createElement('div');
    div.className = classe;
    div.textContent = texto;

    caixa.appendChild(div);

    caixa.scrollTop = caixa.scrollHeight;
}

const formulario = document.getElementById('formulario');

formulario.addEventListener('submit', async (evento) => {
    evento.preventDefault();

    const campo = document.getElementById('texto');

    const mensagem = campo.value.trim();

    if (!mensagem) return;

    mostrar(mensagem, 'cliente');

    campo.value = "";

    const resposta = await fetch("/api/chat", {
        method: "POST",
        headers:{
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            mensagem:mensagem,
            id_cliente: "C03"
        })
    });
    const dados = await resposta.json();

    mostrar(dados.texto, 'bot');

    dados.sugestoes.forEach(p => {
        mostrar(
            `${p.nome} - R$ ${p.preco.toFixed(2)}`,
            'bot'
        )
 
    });
});
    </script>
</body>

</html>
